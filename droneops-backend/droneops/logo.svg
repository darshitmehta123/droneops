<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- outer hexagon -->
  <polygon points="60,6 104,30 104,90 60,114 16,90 16,30" fill="#0a0c0f" stroke="#00d4ff" stroke-width="2.5"/>
  <!-- inner hexagon faint -->
  <polygon points="60,18 96,38 96,82 60,102 24,82 24,38" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  <!-- drone body -->
  <rect x="48" y="52" width="24" height="16" rx="4" fill="#00d4ff"/>
  <!-- rotors -->
  <ellipse cx="38" cy="48" rx="10" ry="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="82" cy="48" rx="10" ry="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="38" cy="72" rx="10" ry="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <ellipse cx="82" cy="72" rx="10" ry="4" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <!-- arms -->
  <line x1="48" y1="54" x2="38" y2="48" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="72" y1="54" x2="82" y2="48" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="48" y1="66" x2="38" y2="72" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="72" y1="66" x2="82" y2="72" stroke="#00d4ff" stroke-width="1.5"/>
  <!-- package hanging -->
  <line x1="60" y1="68" x2="60" y2="78" stroke="#00d4ff" stroke-width="1" stroke-dasharray="2 1"/>
  <rect x="54" y="78" width="12" height="8" rx="2" fill="#00d4ff" opacity="0.7"/>
</svg>
